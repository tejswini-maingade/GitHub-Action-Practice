name: Smart Triggers

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'src/**'
      - 'app/**'

jobs:
  smart-build:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger
        run: |
          echo "Smart trigger workflow running"
          echo "Branch: ${{ github.ref_name }}"

      - name: Build message
        run: echo "Source code changed!"
