name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  file-size-check:
    name: File Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          echo "Checking files larger than 1 MB..."

          large_files=$(find . -type f -not -path './.git/*' -size +1M)

          if [ -n "$large_files" ]; then
            echo "❌ Files larger than 1 MB found:"
            echo "$large_files"
            exit 1
          else
            echo "✅ All files are within 1 MB"
          fi

  branch-name-check:
    name: Branch Name Check
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.head_ref }}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" == feature/* || "$BRANCH" == fix/* || "$BRANCH" == docs/* ]]; then
            echo "✅ Branch name is valid"
          else
            echo "❌ Invalid branch name"
            echo "Use feature/*, fix/*, or docs/*"
            exit 1
          fi

  pr-body-check:
    name: PR Body Check
    runs-on: ubuntu-latest

    steps:
      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "⚠️ Warning: PR description is empty"
          else
            echo "✅ PR description is present"
          fi
