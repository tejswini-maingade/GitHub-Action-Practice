name: Upload Artifact

on:
  workflow_dispatch:

jobs:
  artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Create test report
        run: |
          mkdir -p reports
          echo "Day 44 CI Test Report" > reports/test-report.txt
          echo "Status: PASS" >> reports/test-report.txt
          echo "Generated by GitHub Actions" >> reports/test-report.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test-report.txt
